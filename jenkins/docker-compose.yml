services:
  jenkins:
    build: .
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ..:/var/jenkins_home/proj
      - ${HOME}/.ssh/id_ed25519:/var/jenkins_home/.ssh/id_ed25519:ro
      - ${HOME}/.ssh/id_ed25519.pub:/var/jenkins_home/.ssh/id_ed25519.pub:ro

volumes:
  jenkins_home:
